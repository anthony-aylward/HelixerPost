[package]
name = "rare_helixerpost"
version = "0.1.0"
authors = ["Tony Bolger <bolger.tony@gmail.com>"]
edition = "2018"

[dependencies]
#hdf5 = "0.8.1"
hdf5-metno = "0.9.2"
ndarray = "0.16.1"

[lib]
crate-type = ["cdylib"]

[dependencies.pyo3]
version = "0.29.2"
features = ["extension-module"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
